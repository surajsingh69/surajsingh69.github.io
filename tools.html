        function renderTools(toolsToRender) {
            const container = document.getElementById('tools-container');
            const noResults = document.getElementById('no-results');
            
            if (toolsToRender.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            noResults.style.display = 'none';
            
            container.innerHTML = toolsToRender.map(tool => `
                <div class="tool-card" data-category="${tool.category}">
                    <span class="category-tag">${tool.category}</span>
                    <h3>${tool.name}</h3>
                    <p>${tool.desc}</p>
                    <a href="${tool.url}">Read Full Review →</a>
                </div>
            `).join('');
        }

        function filterTools() {
            const search = document.getElementById('search').value.toLowerCase();
            const category = document.getElementById('category').value;
            
            const filtered = tools.filter(tool => {
                const matchesSearch = tool.name.toLowerCase().includes(search) || 
                                     tool.desc.toLowerCase().includes(search) ||
                                     tool.category.toLowerCase().includes(search);
                const matchesCategory = category === '' || tool.category === category;
                return matchesSearch && matchesCategory;
            });
            
            renderTools(filtered);
        }

        document.getElementById('search').addEventListener('keyup', filterTools);
        document.getElementById('category').addEventListener('change', filterTools);

        // Initial render
        renderTools(tools);
    </script>
